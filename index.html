<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canlı Quiz</title>

<style>
:root{--bg:#F3EFE6;--kart:#FFFDF8;--cz:#D9D3C5;--cz2:#EAE4D6;--m:#1B1A17;--gri:#6B665C;--gri2:#8A8478;--k2:#3A372F;--pas:#E2DCCD;--A:#C63F24;--B:#2F5FD0;--C:#E3A21A;--D:#257A4B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--m);font-family:'Bricolage Grotesque',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--m)}a:hover{color:var(--A)}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit;color:var(--m)}
.mono{font-family:'JetBrains Mono',monospace}
.gri{color:var(--gri)}.kucuk{font-size:13px}
.kes{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.satir-g{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{height:42px;padding:0 18px;border-radius:10px;border:1.5px solid transparent;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;background:transparent;color:var(--m);transition:background .15s}
.btn:active{transform:translateY(1px)}
.btn.ana{background:var(--m);color:var(--bg)}.btn.ana:hover{background:#34322c}
.btn.cizgi{border-color:var(--m);background:var(--kart)}.btn.cizgi:hover{background:var(--cz2)}
.btn.sessiz{border-color:var(--cz);color:var(--gri)}.btn.sessiz:hover{border-color:var(--gri)}
.btn.tehlike{background:var(--A);color:#FFFDF8}.btn.tehlike:hover{background:#A9331C}
.btn.tehlike-c{border-color:var(--A);color:var(--A)}.btn.tehlike-c:hover{background:#F6DDD4}
.btn.link{padding:0;height:auto;color:var(--gri);text-decoration:underline;text-underline-offset:3px}
.btn.buyuk{height:58px;font-size:18px;border-radius:12px;width:100%}
.btn.mini{height:28px;padding:0 10px;font-size:12px;border-radius:6px}
.btn:disabled{background:var(--pas)!important;color:var(--gri2)!important;border-color:transparent!important;cursor:not-allowed;transform:none}
.alan{width:100%;height:48px;border:1.5px solid var(--cz);border-radius:10px;background:var(--kart);padding:0 14px;font-size:17px}
.alan:focus{outline:none;border-color:var(--m)}
.alan.hata{border-color:var(--A)}
textarea.alan{height:auto;padding:12px 14px;line-height:1.45;resize:vertical}
.etiket{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600}
.etiket .not{font-weight:400;color:var(--gri)}
.hata-m{font-size:14px;font-weight:600;color:var(--A)}
.kart{background:var(--kart);border:1px solid var(--cz);border-radius:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.kare{display:grid;grid-template-columns:repeat(2,9px);gap:3px}.kare i{width:9px;height:9px;display:block}
.kare.b{grid-template-columns:repeat(2,22px);gap:6px}.kare.b i{width:22px;height:22px}
.rA{background:var(--A);color:#FFFDF8}.rB{background:var(--B);color:#FFFDF8}.rC{background:var(--C);color:var(--m)}.rD{background:var(--D);color:#FFFDF8}
.harf{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.rozet{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.rozet.yesil{background:#DDEBDD;color:#1F5E3A}.rozet.kirmizi{background:#F6DDD4;color:#8E2C18}.rozet.mavi{background:#DCE4F7;color:#1F3F8E}
h1{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;margin:0}
h2{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.etk{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--gri);letter-spacing:.08em}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--m);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:all .2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.goster{opacity:1;transform:translate(-50%,0)}.toast.kirmizi{background:var(--A);color:#FFFDF8}
.perde{position:fixed;inset:0;background:rgba(27,26,23,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
.pencere{width:100%;max-width:520px;background:var(--kart);border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:16px}
.pencere h2{font-size:28px;line-height:1.15}
.pencere p{margin:0;font-size:16px;line-height:1.5;color:var(--k2);text-wrap:pretty}
.pencere .dugmeler{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.pencere .btn{height:50px;font-size:16px}
/* panel */
.ust{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 40px;border-bottom:1px solid var(--cz);flex-wrap:wrap}
nav{display:flex;gap:28px;font-size:15px;font-weight:600}nav a{color:var(--gri);cursor:pointer;padding-bottom:4px;border-bottom:2px solid transparent;text-decoration:none}nav a.on{color:var(--m);border-color:var(--m)}
.geri{font-size:15px;font-weight:600;color:var(--gri);cursor:pointer;text-decoration:none}
.sayfa{max-width:1240px;margin:0 auto;padding:44px 40px}
.orta{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.giris{width:100%;max-width:400px;display:flex;flex-direction:column;gap:22px}
.tbl{overflow:hidden}
.tsat{display:grid;grid-template-columns:minmax(0,1fr) 60px 110px 300px;gap:16px;padding:16px 24px;align-items:center;border-bottom:1px solid var(--cz2)}
.tsat:last-child{border-bottom:none}
.tsat.bas{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gri);letter-spacing:.06em;padding:12px 24px;border-bottom:1px solid var(--cz)}
.tsat .ad{font-size:17px;font-weight:600}
.tsat .eyl{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tsat .btn{height:36px;padding:0 14px;font-size:14px;border-radius:8px}
.bos{padding:48px 24px;text-align:center;color:var(--gri);font-size:16px;line-height:1.5}
.yukle{display:grid;grid-template-columns:340px minmax(0,1fr);gap:36px;align-items:start}
.ozet{display:flex;flex-direction:column;gap:10px;padding:18px;font-size:15px}
.ozet .s{display:flex;justify-content:space-between}
.uyari-k{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:#F6DDD4;color:#8E2C18;font-size:14px;line-height:1.4}
.ysat{display:grid;grid-template-columns:40px minmax(0,1fr) 60px 150px;gap:14px;padding:11px 20px;align-items:center;border-bottom:1px solid var(--cz2);font-size:14px}
.ysat.bas{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gri);letter-spacing:.06em;border-bottom:1px solid var(--cz)}
.ysat .dur{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.duz{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:calc(100vh - 80px)}
.duz-liste{border-right:1px solid var(--cz);overflow:auto;max-height:calc(100vh - 80px)}
.dl{display:grid;grid-template-columns:28px minmax(0,1fr) 44px;gap:10px;padding:14px 24px;align-items:center;border-bottom:1px solid var(--cz2);cursor:pointer;font-size:14px}
.dl:hover{background:var(--cz2)}.dl.on{background:var(--kart)}
.duz-form{padding:32px 40px;display:flex;flex-direction:column;gap:20px;max-width:900px}
.sik{display:grid;grid-template-columns:32px minmax(0,1fr) 28px;gap:12px;align-items:center;padding:8px 12px;border:1.5px solid var(--cz);border-radius:10px;background:var(--kart)}
.sik.ok{border-color:var(--D)}
.sik input{border:none;background:transparent;font-size:15px;padding:6px 0;outline:none;width:100%}
.radyo{width:24px;height:24px;border-radius:999px;border:2px solid var(--cz);background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.radyo.on{border-color:var(--D)}.radyo.on::after{content:'';width:10px;height:10px;border-radius:999px;background:var(--D)}
.sure-k{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.sure-k input{width:84px;height:38px;font-size:16px;text-align:center}
/* canlı panel */
.ilerleme{height:6px;background:var(--pas)}.ilerleme i{display:block;height:6px;background:var(--m);transition:width .2s linear}
.iki{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:48px;align-items:start}
.bek{display:grid;grid-template-columns:400px minmax(0,1fr);gap:48px;align-items:start}
.dev{font-family:'JetBrains Mono',monospace;font-size:88px;font-weight:600;letter-spacing:.08em;line-height:1}
.sayac{display:flex;align-items:baseline;gap:14px}.sayac .mono{font-size:72px;font-weight:600;line-height:1}
.soru-b{font-size:28px;font-weight:600;line-height:1.3;letter-spacing:-.01em;text-wrap:pretty}
.sec-iz{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec-k{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border-radius:10px;background:var(--kart);border:1px solid var(--cz);font-size:14px;line-height:1.35}
.cipler{display:flex;flex-wrap:wrap;gap:10px}
.cip{height:46px;padding:0 18px;border-radius:999px;background:var(--kart);border:1px solid var(--cz);display:flex;align-items:center;font-size:17px;font-weight:600}
.cvl{display:flex;flex-direction:column;border-top:1px solid var(--cz)}
.cvl div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--cz2);font-size:16px;font-weight:600}
.cvl .bk{color:var(--gri2)}.cvl span{font-size:13px}
.dsat{display:grid;grid-template-columns:34px minmax(0,1fr) 44px;gap:14px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--kart);border:2px solid var(--cz)}
.dsat.ok{border-color:var(--D)}.dsat.soluk{opacity:.6}
.dsat .harf{width:34px;height:34px}
.dsat .dm{font-size:14px;line-height:1.3;margin-bottom:6px}
.bar{height:10px;background:var(--cz2);border-radius:5px;overflow:hidden}.bar i{display:block;height:10px;border-radius:5px}
.dsat .n{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;text-align:right}
.dsat.k{grid-template-columns:26px minmax(0,1fr) 26px;gap:10px;padding:7px 10px}.dsat.k .harf{width:26px;height:26px;font-size:13px;border-radius:6px}.dsat.k .n{font-size:16px}.dsat.k .bar,.dsat.k .bar i{height:8px}
.acik{font-size:14px;line-height:1.5;color:var(--k2);padding:14px 16px;text-wrap:pretty}
.ilk5 .s{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;margin-bottom:10px;font-size:18px;font-weight:600}
.ilk5 .s .mono:first-child{color:var(--gri)}
.podyum{display:flex;align-items:flex-end;justify-content:center;gap:16px}
.bsm{width:220px;display:flex;flex-direction:column;align-items:center;gap:10px}
.bsm .pad{font-size:26px;font-weight:700;text-align:center}.bsm .pp{font-size:17px}
.bsm .blok{width:100%;display:flex;justify-content:center;padding-top:18px;font-size:48px;font-weight:800;border-radius:10px 10px 0 0}
.podyum.k{gap:8px}.podyum.k .bsm{width:auto;flex:1;gap:6px}.podyum.k .pad{font-size:18px}.podyum.k .pp{font-size:13px}.podyum.k .blok{font-size:34px;padding-top:12px;border-radius:8px 8px 0 0}
/* katılımcı */
.tel{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.tel .ic{padding:40px 24px 28px;display:flex;flex-direction:column;gap:22px;flex:1}
.tel .ortala{justify-content:center}
.tel h1{font-size:34px;line-height:1.05}
.tel .metin{font-size:18px;line-height:1.45;color:var(--k2);text-wrap:pretty;margin:0}
.tel .ustbar{display:flex;justify-content:space-between;align-items:center;padding:24px 20px 12px;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600}
.tel .ustbar .sn{font-size:22px}
.tel .ince{height:5px;background:var(--pas);margin:0 20px;border-radius:3px;overflow:hidden}.tel .ince i{display:block;height:5px;background:var(--m);transition:width .2s linear}
.tel .soru{padding:20px 20px 16px;font-size:20px;font-weight:600;line-height:1.3;text-wrap:pretty}
.cvp{flex:1;display:flex;flex-direction:column;gap:10px;padding:0 16px 20px}
.cvp button{flex:1;min-height:72px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;padding:10px 14px;border-radius:14px;border:none;text-align:left;font-size:15px;line-height:1.3;font-weight:500}
.cvp button b{font-size:22px;font-weight:800}
.cvp button:active{transform:scale(.98)}
.cvp.kilit button{background:var(--pas);color:var(--gri2);cursor:default}
.cvp.kilit button.sec{outline:3px solid var(--m);outline-offset:3px}
.cvp.kilit button.sec.rA{background:var(--A);color:#FFFDF8}.cvp.kilit button.sec.rB{background:var(--B);color:#FFFDF8}.cvp.kilit button.sec.rC{background:var(--C);color:var(--m)}.cvp.kilit button.sec.rD{background:var(--D);color:#FFFDF8}
.alt-not{padding:6px 20px 28px;text-align:center;font-size:16px;font-weight:600}
.sonuc-bas{padding:32px 22px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sonuc-bas .b{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.sonuc-bas .alt{font-size:14px;font-weight:600;margin-top:6px;opacity:.9}
.sonuc-bas.dogru{background:var(--D);color:#FFFDF8}.sonuc-bas.yanlis{background:var(--A);color:#FFFDF8}.sonuc-bas.yok{background:var(--m);color:var(--bg)}
.kilk5{padding:6px 18px 24px;border-top:1px solid var(--cz);margin-top:auto}
.kilk5 .s{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;font-size:15px;padding:3px 0}
.oniz{position:fixed;right:12px;bottom:12px;z-index:60;background:var(--m);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;font-size:12px;font-family:'JetBrains Mono',monospace}
.oniz button{background:transparent;border:1px solid #5a564d;color:var(--bg);border-radius:7px;padding:5px 9px;font-size:12px;font-family:inherit;white-space:nowrap}
.oniz button:hover{background:#34322c}
@media (max-width:900px){
  .ust{padding:14px 20px}.sayfa{padding:28px 20px}
  .yukle,.iki,.bek,.duz{grid-template-columns:1fr}
  .duz-liste{max-height:260px;border-right:none;border-bottom:1px solid var(--cz)}
  .duz-form{padding:24px 20px}
  .tsat{grid-template-columns:minmax(0,1fr) auto;padding:14px 16px}.tsat>.o{display:none}.tsat .eyl{grid-column:1/-1;justify-content:flex-start}
  .ysat{grid-template-columns:32px minmax(0,1fr) 110px}.ysat>.o{display:none}
  .sec-iz{grid-template-columns:1fr}.dev{font-size:64px}.bsm{width:auto;flex:1}
}
.qr{background:#FFFDF8;border:1px solid var(--cz);border-radius:14px;padding:22px}.qr svg{display:block;width:100%;height:auto}
.serit{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 22px}
</style>
</head>

<div id="app"><div class="orta gri">Yükleniyor…</div></div>
<div id="toast" class="toast"></div>
<script>
var HARF = ['A', 'B', 'C', 'D'];
var app = document.getElementById('app');
var ODA = (new URLSearchParams(location.search).get('oda') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
var TABAN = location.href.split('?')[0].split('#')[0];
var DB = null, UID = '', MOD = '', sonHtml = '';
var KOTA = 'Bugünkü ücretsiz kullanım kotası doldu. Kota her gün 10:00–11:00 arası yenilenir.';

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function logo(b) { return '<div class="kare' + (b ? ' b' : '') + '"><i class="rA"></i><i class="rB"></i><i class="rC"></i><i class="rD"></i></div>'; }
function tarih(ms) { return ms ? new Date(ms).toLocaleDateString('tr-TR') : '—'; }
function uyari(m, kirmizi) { var t = document.getElementById('toast'); t.textContent = m; t.className = 'toast goster' + (kirmizi ? ' kirmizi' : ''); clearTimeout(uyari.z); uyari.z = setTimeout(function () { t.className = 'toast'; }, 4200); }
function hata(e) { uyari(e && e.message ? e.message : String(e), true); }
function dbHata(e) {
  var k = (e && (e.code || '')) + ' ' + (e && e.message || '');
  if (/resource-exhausted|quota/i.test(k)) uyari(KOTA, true);
  else if (/permission/i.test(k)) uyari('Yetki hatası. Firestore kuralları yüklenmemiş olabilir.', true);
  else if (/unavailable|network|offline/i.test(k)) uyari('Bağlantı yok. İnternet bağlantısını kontrol edin.', true);
  else hata(e);
}
function bas(html, zorla) { if (zorla || html !== sonHtml) { app.innerHTML = html; sonHtml = html; saat(); } }
function jsonOku(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function saat() {
  var els = document.querySelectorAll('[data-bitis]');
  for (var i = 0; i < els.length; i++) {
    var el = els[i], b = +el.getAttribute('data-bitis'), s = +el.getAttribute('data-sure');
    var kalan = Math.max(0, (b - Date.now()) / 1000);
    if (el.getAttribute('data-tip') === 'bar') el.style.width = Math.min(100, kalan / s * 100) + '%';
    else el.textContent = Math.ceil(kalan);
  }
}
setInterval(saat, 200);
function scriptYukle(src) { return new Promise(function (ok, red) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = function () { red(new Error(src + ' yüklenemedi')); }; document.head.appendChild(s); }); }

/* =================== VERİ KATMANI =================== */
function firebaseDB(cfg) {
  firebase.initializeApp(cfg);
  var fs = firebase.firestore(), au = firebase.auth();
  var ts = function () { return firebase.firestore.FieldValue.serverTimestamp(); };
  var oda = function (k) { return fs.collection('odalar').doc(k); };
  function toplu(refler) {
    var p = Promise.resolve();
    for (var i = 0; i < refler.length; i += 450) (function (parca) {
      p = p.then(function () { var b = fs.batch(); parca.forEach(function (r) { b.delete(r); }); return b.commit(); });
    })(refler.slice(i, i + 450));
    return p;
  }
  var api = {
    canli: true,
    giris: function () {
      return new Promise(function (ok, red) {
        var u = au.onAuthStateChanged(function (x) {
          u();
          if (x) ok(x.uid);
          else au.signInAnonymously().then(function (c) { ok(c.user.uid); }, function (e) {
            red(new Error(/operation-not-allowed/.test(e.code) ? 'Firebase\'de Anonim giriş açık değil (Authentication → Oturum açma yöntemi).' : e.message));
          });
        });
      });
    },
    odaOlustur: function (k, d) { return oda(k).set(Object.assign({ olusturma: ts() }, d)); },
    odaGuncelle: function (k, d) { return oda(k).update(d); },
    odaDinle: function (k, cb, err) { return oda(k).onSnapshot(function (s) { cb(s.exists ? s.data() : null); }, err); },
    oyuncuYaz: function (k, uid, d) { return oda(k).collection('oyuncular').doc(uid).set(Object.assign({ t: ts() }, d)); },
    oyunculariDinle: function (k, cb, err) { return oda(k).collection('oyuncular').onSnapshot(function (q) { cb(q.docs.map(function (d) { return Object.assign({ uid: d.id }, d.data()); })); }, err); },
    cevapYaz: function (k, id, d) { return oda(k).collection('cevaplar').doc(id).set(Object.assign({ t: ts() }, d)); },
    cevaplariDinle: function (k, cb, err) {
      return oda(k).collection('cevaplar').onSnapshot(function (q) {
        var l = q.docChanges().filter(function (c) { return c.type === 'added'; }).map(function (c) { return Object.assign({ id: c.doc.id }, c.doc.data()); });
        if (l.length) cb(l);
      }, err);
    },
    odaSil: function (k, bilinen) {

/* ---- CSV ---- */
function csvParcala(t) {
  t = t.replace(/^\uFEFF/, '');
  var ilk = t.split(/\r?\n/)[0] || '', ayr = (ilk.split(';').length > ilk.split(',').length) ? ';' : ',';

    var ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ayr) { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }

  return rows.filter(function (r) { return r.some(function (x) { return String(x).trim() !== ''; }); });
}
function kucult(s) { return String(s || '').replace(/İ/g, 'i').replace(/I/g, 'ı').toLowerCase().replace(/\s+/g, ' ').trim(); }
function csvOku(t, dosya) {

  var iO = HARF.map(function (x) { var l = x.toLowerCase(); return bul([new RegExp('^option ' + l + '$'), new RegExp('^' + l + '$'), new RegExp('(seçenek|şık|cevap) ' + l + '$'), new RegExp('^' + l + ' (şıkkı|seçeneği)$')]); });

  if (iS < 0 || iO.some(function (x) { return x < 0; }) || iD < 0) throw new Error('CSV sütunları tanınmadı. Question, Option A–D ve Correct Answer sütunları gerekli.');

    var sec = iO.map(function (i) { return String(x[i] || '').trim(); });
    var dv = String(x[iD] || '').trim(), d = '';
    var m = dv.match(/^([A-Da-d])(?=$|[\s\.\):\-])/);

    var bos = sec.filter(function (s) { return !s; }).length;
    var metin = String(x[iS] || '').trim();
    var sorun = !metin ? 'Soru metni yok' : bos === 4 ? 'Şık yok' : bos ? 'Şık eksik' : !d ? 'Doğru cevap yok' : '';
    return { no: n + 1, metin: metin, secenekler: sec, dogru: d, aciklama: iA >= 0 ? String(x[iA] || '').trim() : '', sorun: sorun };
  });
  var gecerli = sat.filter(function (s) { return !s.sorun; }), karisti = false;
  if (gecerli.length > 1 && gecerli.every(function (s) { return s.dogru === 'A'; })) {
    karisti = true;
    gecerli.forEach(function (s) {

      for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t2 = a[i]; a[i] = a[j]; a[j] = t2; }

}

    : e === 'soru' ? kSoru(v)
    : e === 'cevap' ? kCevap(v)
    : e === 'podyum' ? kPodyum(v) : '';
  bas(h, zorla);
}

/* =================== BAŞLANGIÇ =================== */
function onizlemeCubugu() {
  if (DB.canli) return;
  var d = document.createElement('div');
  d.className = 'oniz';
  d.innerHTML = '<span>ÖNİZLEME</span>' + (MOD === 'panel' ? '<button onclick="ogrenciSekmesi()">+ Öğrenci sekmesi</button>' : '') + '<button onclick="onizlemeSifirla()">Sıfırla</button>';
  document.body.appendChild(d);
}
function ogrenciSekmesi() { if (!S) return uyari('Önce bir yarışma başlatın', true); window.open(TABAN + '?oda=' + S.kod, '_blank', 'noopener'); }
function onizlemeSifirla() {
  if (!confirm('Önizleme yarışmaları silinsin mi? Quizleriniz silinmez.')) return;
  Object.keys(localStorage).forEach(function (k) { if (k === 'cqv3_onizleme_db' || k === 'cqv3_aktif' || /^cqv3_(ad|cvp)_/.test(k)) localStorage.removeItem(k); });
  location.reload();
}
function veriKatmani() {
  var c = window.FIREBASE_AYAR;
  if (!c || !c.apiKey) return Promise.resolve(yerelDB());
  var s = 'https://www.gstatic.com/firebasejs/10.12.5/firebase-';
  return scriptYukle(s + 'app-compat.js').then(function () { return Promise.all([scriptYukle(s + 'auth-compat.js'), scriptYukle(s + 'firestore-compat.js')]); }).then(function () { return firebaseDB(c); });
}
veriKatmani().then(function (d) { DB = d; return DB.giris(); }).then(function (uid) {
  UID = uid; MOD = ODA ? 'oyuncu' : 'panel';
  onizlemeCubugu();
  if (MOD === 'panel') panelBasla(); else oyuncuBasla();
}).catch(function (e) {
  app.innerHTML = '<div class="orta"><div style="max-width:460px;display:flex;flex-direction:column;gap:12px">' + logo(true) + '<h2>Bağlanılamadı</h2><div class="gri" style="font-size:16px;line-height:1.5">' + esc(e.message) + '</div><div><button class="btn ana" onclick="location.reload()">Tekrar dene</button></div></div></div>';
});
</script>
